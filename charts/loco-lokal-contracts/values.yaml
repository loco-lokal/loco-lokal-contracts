# The loco-lokal ApplicationSet deploys this chart into the loco-lokal namespace.
# CI publishes the full commit SHA on every push to main; Argo CD overrides image.tag.
image:
  repository: ghcr.io/loco-lokal/loco-lokal-contracts
  tag: latest
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-pull

# Puma embeds Sidekiq and Redis. One instance with Recreate updates prevents concurrent
# writers to Redis's files and simultaneous application migrations.
port: 3000
healthPath: /up
terminationGracePeriodSeconds: 90

# Production boot migrates the shared database. SECRET_KEY_BASE must come from Infisical,
# otherwise DocuSeal generates a local key and can lose access to encrypted settings.
# HOST and APP_URL are derived from ingress.host in the Deployment.
env:
  RAILS_ENV: production
  FORCE_SSL: "true"
  RUN_MIGRATIONS: "true"
  WORKDIR: /data/docuseal
  WEB_CONCURRENCY: "0"
  RAILS_MAX_THREADS: "5"
  SIDEKIQ_THREADS: "5"

# This store is defined in loco-local-infra for the Infisical project loco-lokal-contracts
# (environment prod, root folder). Each key becomes an env var of the same name.
# Preserve an existing instance's key when migrating: changing it breaks encrypted settings.
envFromSecret: loco-lokal-contracts-env
secretStore: loco-lokal-contracts
secretKeys:
  - SECRET_KEY_BASE

# CloudNativePG in loco-local-infra owns this database and password Secret. Read separate
# connection fields rather than embedding a password in a URL. No database runs in this chart.
database:
  host: loco-lokal-postgres-rw
  port: 5432
  name: contracts
  user: contracts
  passwordSecret: loco-lokal-postgres-contracts
  passwordKey: password

# Proposed public hostname. Caddy terminates TLS before Traefik; no Ingress TLS section.
# Publishing the chart does not change Caddy or DNS. Complete account setup before cutover.
ingress:
  enabled: true
  className: traefik
  host: contracts.loco-lokal.de

# Persist attachments and embedded Redis snapshots at the image's WORKDIR. The host-backed
# local-retain class survives PVC deletion; Delete=false also keeps this claim on app removal.
# Back up both this volume and PostgreSQL. Retention is not a backup.
storage:
  storageClass: local-retain
  size: 10Gi

# Rails, the embedded worker and native PDF/image processing share this memory budget.
# Tune against actual workloads after deployment; leave CPU bursts available for PDFs.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
