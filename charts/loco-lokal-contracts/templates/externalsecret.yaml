{{- if .Values.secretKeys }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "loco-lokal-contracts.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secretStore is required with secretKeys" .Values.secretStore }}
  target:
    name: {{ required "envFromSecret is required with secretKeys" .Values.envFromSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range .Values.secretKeys }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ . }}
    {{- end }}
{{- end }}
