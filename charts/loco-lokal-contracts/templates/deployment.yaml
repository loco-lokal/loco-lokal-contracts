{{- $_ := required "envFromSecret is required" .Values.envFromSecret }}
{{- $_ := required "ingress.host is required for public URLs" .Values.ingress.host }}
{{- $_ := required "env.WORKDIR is required" .Values.env.WORKDIR }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "loco-lokal-contracts.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "loco-lokal-contracts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "loco-lokal-contracts.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: docuseal
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            - name: HOST
              value: {{ .Values.ingress.host | quote }}
            - name: APP_URL
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            - name: DATABASE_HOST
              value: {{ required "database.host is required" .Values.database.host | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.database.port | quote }}
            - name: DATABASE_NAME
              value: {{ required "database.name is required" .Values.database.name | quote }}
            - name: DATABASE_USER
              value: {{ required "database.user is required" .Values.database.user | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.passwordSecret is required" .Values.database.passwordSecret }}
                  key: {{ required "database.passwordKey is required" .Values.database.passwordKey }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # Rails /up returns 200 once boot completes. Forwarded protocol avoids HTTPS
          # redirects when probes connect directly to Puma behind the TLS terminator.
          startupProbe:
            httpGet: &healthCheck
              path: {{ .Values.healthPath }}
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            failureThreshold: 120
            periodSeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet: *healthCheck
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: *healthCheck
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: {{ .Values.env.WORKDIR | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
