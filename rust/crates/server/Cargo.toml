[package]
name = "loco-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
percent-encoding = "2.3.2"
hmac = "0.13.0"
chrono-tz = "0.10.4"
reqwest = "0.13.5"
hex = "0.4.3"
loco-db = { version = "0.1.0", path = "../db" }
loco-domain = { version = "0.1.0", path = "../domain" }
loco-jobs = { version = "0.1.0", path = "../jobs" }
loco-mailer = { version = "0.1.0", path = "../mailer" }
loco-pdf = { version = "0.1.0", path = "../pdf" }
loco-rails-compat = { version = "0.1.0", path = "../rails-compat" }
loco-storage = { version = "0.1.0", path = "../storage" }
loco-views = { version = "0.1.0", path = "../views" }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "fs", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.29.1", features = ["v4", "v5"] }
fancy-regex = "0.20.0"
regex = "1.13.1"
strsim = "0.11.1"
sha1 = "0.11.0"
ammonia = "4.2.4"
multer = "3.1.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "ico"] }
md-5 = "0.11.0"
mime_guess = "2.0.5"

[lints]
workspace = true

[dev-dependencies]
chrono = "0.4.45"
form_urlencoded = "1.2.2"
hex = "0.4.3"
http-body-util = "0.1.5"
loco-db = { path = "../db" }
loco-rails-compat = { path = "../rails-compat" }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
tracing-subscriber = "0.3.23"
