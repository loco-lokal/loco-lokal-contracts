[package]
name = "loco-detect"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
loco-pdf = { version = "0.1.0", path = "../pdf" }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"] }
regex = "1.13.1"
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v4"] }

[lints]
workspace = true
