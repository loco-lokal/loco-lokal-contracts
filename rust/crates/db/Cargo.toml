[package]
name = "loco-db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
chrono = "0.4.45"
loco-domain = { path = "../domain" }
serde_json = "1.0.154"
uuid = { version = "1.20.0", features = ["v4"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "uuid", "json", "migrate"] }
thiserror = "2.0.21"
regex = "1.13.1"

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
