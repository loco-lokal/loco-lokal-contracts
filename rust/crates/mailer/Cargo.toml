[package]
name = "loco-mailer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls", "ring", "webpki-roots", "hostname"] }
rand = "0.10.3"
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
