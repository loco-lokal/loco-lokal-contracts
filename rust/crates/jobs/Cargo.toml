[package]
name = "loco-jobs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
loco-db = { version = "0.1.0", path = "../db" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
