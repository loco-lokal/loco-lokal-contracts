[package]
name = "loco-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
futures = "0.3.34"
md-5 = "0.11.0"
object_store = { version = "0.14.2", features = ["aws", "gcp", "azure"] }
rand = "0.10.3"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono"] }
thiserror = "2.0.21"
uuid = { version = "1.29.1", features = ["v4"] }

[lints]
workspace = true

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "chrono", "migrate"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
