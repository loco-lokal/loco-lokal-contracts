{#- Port of app/views/devise/passwords/new.html.erb -#}
{% extends "layouts/application.html" %}
{% import "shared/_button_title.html" as buttons %}
{% block content %}
<div class="agency-auth max-w-lg mx-auto ">
    <h1 class="text-4xl font-bold text-center mt-8">
      {{ t('forgot_your_password_') }}
    </h1>
  <form class="space-y-6" id="new_user" action="/password" accept-charset="UTF-8" method="post"><input type="hidden" name="authenticity_token" value="{{ csrf_token }}" />
    <div class="space-y-2">
      {% include "devise/shared/_error_messages.html" %}
      <div class="form-control">
        <label class="label" for="user_email">{{ t('email') }}</label>
        <input autofocus="autofocus" autocomplete="email" class="base-input" type="email" {% if email %}value="{{ email }}" {% endif %}name="user[email]" id="user_email" />
      </div>
    </div>
    <div class="form-control">
      <button name="button" type="submit" class="base-button">{{ buttons.button_title(title=t('reset_password'), disabled_with=t('resetting_password')) }}</button>
    </div>
</form></div>
{% endblock %}
