# cargo-deny: security advisories, licenses, and duplicate/unknown sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin attack: timing side channel in `rsa` decryption and signing. `rsa` only
  # generates the e-signing keys at first-run setup (loco-domain::certificates); ring
  # does the signing. Revisit if `rsa` is used for private-key operations (Phase 4).
  { id = "RUSTSEC-2023-0071", reason = "rsa is only used for key generation" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "AGPL-3.0-only",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
